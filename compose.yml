services:
  mongo:
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    ports:
      - 6379:6379

  pulsar:
    image: apachepulsar/pulsar:4.0.4
    command: bin/pulsar standalone
    ports:
      - 6650:6650 # client (PULSAR_URL)
      - 8080:8080 # admin API
    volumes:
      - pulsar_data:/pulsar/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: message_system
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
    ports:
      - 8123:8123 # HTTP (CLICKHOUSE_URL)
      - 9000:9000 # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - 16686:16686 # UI → http://localhost:16686
      - 4317:4317 # OTLP gRPC (OTEL_ADDRESS)
      - 4318:4318 # OTLP HTTP

volumes:
  mongo_data:
  pulsar_data:
  clickhouse_data:
